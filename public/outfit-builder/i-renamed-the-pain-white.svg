<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220">
  <title>I RENAMED THE PAIN</title>
  <g fill="#fafafa" font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="180" y="55" font-size="48" textLength="340" lengthAdjust="spacingAndGlyphs">I RENAMED</text>
    <text x="180" y="104" font-size="38">THE</text>
    <text x="180" y="204" font-size="104" textLength="320" lengthAdjust="spacingAndGlyphs">PAIN.</text>
  </g>
</svg>
